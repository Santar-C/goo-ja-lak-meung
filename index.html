<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>เลือกโหมด</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sarabun:wght@400;600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Sarabun',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bg-left{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(160deg,#1a0800 0%,#0a0400 100%)}
.bg-right{position:absolute;right:0;top:0;bottom:0;width:50%;background:linear-gradient(200deg,#040010 0%,#000208 100%)}
.bg-divider{position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent 0%,rgba(255,255,255,0.15) 30%,rgba(255,255,255,0.15) 70%,transparent 100%);transform:translateX(-50%);z-index:5}
.glow-left{position:absolute;left:-20px;top:35%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,80,20,0.18) 0%,transparent 70%);filter:blur(30px);pointer-events:none;animation:gp 3s ease-in-out infinite alternate}
.glow-right{position:absolute;right:-20px;top:35%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(60,100,255,0.15) 0%,transparent 70%);filter:blur(30px);pointer-events:none;animation:gp 3s ease-in-out infinite alternate-reverse}
@keyframes gp{from{opacity:.6;transform:scale(1)}to{opacity:1;transform:scale(1.2)}}
.top-title{position:relative;z-index:10;text-align:center;padding:36px 20px 16px}
.top-eyebrow{font-size:9px;letter-spacing:6px;color:rgba(255,255,255,0.2);text-transform:uppercase;font-weight:700;margin-bottom:8px}
.top-line{width:30px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);margin:0 auto 8px}
.top-desc{font-size:11px;color:rgba(255,255,255,0.16);letter-spacing:1px}
.cards-row{flex:1;display:flex;position:relative;z-index:10;padding-bottom:28px}
.half{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:16px 10px 18px;cursor:pointer;position:relative;transition:all .25s cubic-bezier(0.34,1.56,0.64,1);-webkit-user-select:none;user-select:none}
.half:active{transform:scale(0.95)}
.half-left{border-right:1px solid rgba(255,107,43,0.06)}
.half-right{border-left:1px solid rgba(100,140,255,0.06)}
.half-icon{font-size:52px;margin-bottom:14px;transition:transform .3s cubic-bezier(0.34,1.56,0.64,1)}
.half:active .half-icon{transform:scale(0.88) translateY(4px)}
.half-title-th{font-size:11px;font-weight:900;color:rgba(255,255,255,0.4);letter-spacing:1px;text-align:center;margin-bottom:4px}
.half-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;text-align:center;line-height:1;margin-bottom:8px}
.t-drag{color:#ff6b2b}
.t-beast{font-family:'Cinzel',sans-serif;font-size:17px;letter-spacing:4px;color:#8aabff}
.half-desc{font-size:10px;text-align:center;line-height:1.6;max-width:128px}
.d-drag{color:rgba(255,150,80,0.5)}
.d-beast{color:rgba(140,180,255,0.4)}
.half-badge{margin-top:10px;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:50px}
.b-drag{background:rgba(255,107,43,0.1);border:1px solid rgba(255,107,43,0.22);color:rgba(255,107,43,0.65)}
.b-beast{background:rgba(100,140,255,0.07);border:1px solid rgba(100,140,255,0.18);color:rgba(140,180,255,0.55)}
.tap-hint{position:absolute;bottom:8px;font-size:8px;color:rgba(255,255,255,0.14);letter-spacing:2px;text-transform:uppercase;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.8}}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.fl-o{background:rgba(255,107,43,0.06)}
.fl-b{background:rgba(100,140,255,0.05)}
.half:active .flash{opacity:1}
.returning-badge{position:absolute;top:12px;right:12px;z-index:20;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:50px;padding:4px 10px;font-size:8px;color:rgba(255,255,255,0.3);font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;display:none}
.returning-badge.show{display:block}
.returning-badge:active{background:rgba(255,255,255,0.1)}
.top-title{animation:fd .7s ease .1s both}
.half-left{animation:fl .7s ease .3s both}
.half-right{animation:fr .7s ease .5s both}
.bg-divider{animation:fi .5s ease .2s both}
@keyframes fd{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fr{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@media(max-width:200px),(max-height:220px){
  .top-title{display:none}.half-desc,.half-badge,.tap-hint{display:none}
  .half{padding:8px 5px 10px}.half-icon{font-size:34px;margin-bottom:10px}
  .half-title{font-size:16px}.t-beast{font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bg-left"></div><div class="bg-right"></div>
  <div class="bg-divider"></div>
  <div class="glow-left"></div><div class="glow-right"></div>
  <div class="returning-badge" id="retBadge" onclick="returnMode()">← กลับ</div>
  <div class="top-title">
    <p class="top-eyebrow">เลือกเส้นทาง</p>
    <div class="top-line"></div>
    <p class="top-desc">Choose Your Path</p>
  </div>
  <div class="cards-row">
    <div class="half half-left" onclick="pick('draglak')">
      <div class="flash fl-o"></div>
      <div class="half-icon">💀</div>
      <p class="half-title-th">โหมดเพื่อนด่า</p>
      <p class="half-title t-drag">กูจะลาก<br>มึงเอง</p>
      <p class="half-desc d-drag">เทรนเนอร์ที่ด่าเหมือนเพื่อนรัก ไม่มีเอาใจ มีแต่ผลลัพธ์</p>
      <span class="half-badge b-drag">🔥 Trainer Mode</span>
      <span class="tap-hint">แตะ</span>
    </div>
    <div class="half half-right" onclick="pick('beastborne')">
      <div class="flash fl-b"></div>
      <div class="half-icon">⚔️</div>
      <p class="half-title-th">โหมดอัศวิน</p>
      <p class="half-title t-beast">BEAST<br>BORNE</p>
      <p class="half-desc d-beast">รับบทอัศวิน ปราบบอสปีศาจ เควสทุกวัน สะสมเลเวล</p>
      <span class="half-badge b-beast">⚡ RPG Mode</span>
      <span class="tap-hint">แตะ</span>
    </div>
  </div>
</div>
<script>
function pick(m){
  localStorage.setItem('selectedMode',m);
  document.querySelector('.wrap').style.cssText='opacity:0;transition:opacity .22s';
  setTimeout(()=>{location.href=m+'.html';},220);
}
function returnMode(){const m=localStorage.getItem('selectedMode');if(m)pick(m);}
const sm=localStorage.getItem('selectedMode');
const hd=sm&&localStorage.getItem(sm==='beastborne'?'BB_State':'GJL_State');
if(hd){const b=document.getElementById('retBadge');b.textContent='← '+(sm==='beastborne'?'BEASTBORNE':'กูจะลากมึงเอง');b.classList.add('show');}
</script>
</body>
</html>
